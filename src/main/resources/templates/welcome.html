<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="fragments/header :: head">
    <title>Добро пожаловать - Logos</title>
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <!-- Логотип и заголовок -->
                    <div class="text-center mb-4">
                        <div class="feature-icon mx-auto mb-3">
                            <i class="fas fa-hourglass-half fa-3x text-primary"></i>
                        </div>
                        <h1 class="h3 mb-2">Logos</h1>
                        <p class="text-muted">Memento mori</p>
                    </div>

                    <!-- Сообщения об ошибках -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Неверное имя пользователя или пароль
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        Вы успешно вышли из системы
                    </div>

                    <!-- Табы -->
                    <ul class="nav nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab"
                                    data-bs-target="#login" type="button">Вход</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab"
                                    data-bs-target="#register" type="button">Регистрация</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Форма входа -->
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form th:action="@{/login}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label class="form-label">Имя пользователя</label>
                                    <input type="text" class="form-control" name="username" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Пароль</label>
                                    <input type="password" class="form-control" name="password" required>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">Войти</button>
                                </div>

                                <div class="text-center mt-3">
                                    <small class="text-muted">
                                        Тестовые аккаунты:<br>
                                        admin / Admin123!<br>
                                        testuser / User123!
                                    </small>
                                </div>
                            </form>
                        </div>

                        <!-- Форма регистрации -->
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form id="registerForm" method="post" th:action="@{/api/auth/register}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label class="form-label">Имя пользователя</label>
                                    <input type="text" class="form-control" name="username"
                                           required minlength="3" maxlength="50">
                                    <div class="form-text">3-50 символов (только буквы, цифры, _)</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Пароль</label>
                                    <input type="password" class="form-control" name="password"
                                           required minlength="8">
                                    <div class="form-text">Минимум 8 символов, включая буквы и цифры</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Подтверждение пароля</label>
                                    <input type="password" class="form-control" name="confirmPassword" required minlength="8">
                                    <div class="form-text">Повторите пароль</div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Дата рождения</label>
                                        <input type="date" class="form-control" name="birthDate" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Предполагаемая дата смерти</label>
                                        <input type="date" class="form-control" name="deathDate" required>
                                    </div>
                                </div>



                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success btn-lg">Зарегистрироваться</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="card-footer text-center bg-transparent border-0">
                    <p class="text-muted small mb-0">
                        Используя приложение, вы принимаете
                        <a href="#" class="text-decoration-none">условия использования</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Подключаем валидатор и скрипт страницы -->
<script th:src="@{/js/validation.js}"></script>
<script th:src="@{/js/welcome.js}"></script>
</body>
</html>

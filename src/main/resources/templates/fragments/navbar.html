<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/calendar}">
                <i class="fas fa-ankh"></i> Logos
            </a>

            <!-- Счетчик жизни -->
            <div class="life-counter ms-3" th:if="${lifeCountdown}">
                <span class="counter-label">Осталось:</span>
                <span class="counter-value">
                    <span th:text="${lifeCountdown.years}">0</span> лет,
                    <span th:text="${lifeCountdown.months}">0</span> мес,
                    <span th:text="${lifeCountdown.days}">0</span> дней
                    (<span th:text="${lifeCountdown.totalDays}">0</span> дней всего)
                </span>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/calendar}">
                            <i class="fas fa-calendar"></i> Календарь
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dreams}">
                            <i class="fas fa-star"></i> Мечты
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}">
                            <i class="fas fa-user"></i> Профиль
                        </a>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="nav-link">
                            <button type="submit" class="btn btn-link nav-link p-0" style="border: none; background: none;">
                                <i class="fas fa-sign-out-alt"></i> Выйти
                            </button>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
